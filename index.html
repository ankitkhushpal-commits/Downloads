<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Downloads</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>File downloads</h1>

  <p id="msg"></p>
</main>
<script src="script.js"></script>
</body>
</html>
